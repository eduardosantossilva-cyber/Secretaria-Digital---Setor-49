<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel da Secretaria | AD Belém 49</title>

  <style>

  .btn-sair{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 18px;
  border-radius:9px;
  background:#fff;
  color:#073c66;
  text-decoration:none;
  font-weight:900;
  border:1px solid rgba(255,255,255,.6);
  transition:.2s;
  white-space:nowrap;
}

.btn-sair:hover{
  background:#b51e2a;
  color:#fff;
  border-color:#b51e2a;
}

@media(max-width:650px){
  .btn-sair{
    width:100%;
    margin-top:10px;
  }
}
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fa;
      color: #073c66;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    header {
      background: linear-gradient(
        135deg,
        #073c66,
        #159dd1
      );

      color: white;
      padding: 22px 20px;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.15);
    }

.cabecalho{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}

.titulo{
  flex:1;
}

.titulo h1{
  font-size:30px;
  margin-bottom:6px;
  line-height:1.2;
}

.titulo p{
  font-size:16px;
  opacity:.92;
}

.acoes-cabecalho{
  display:flex;
  align-items:center;
  gap:18px;
}

.btn-sair{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:42px;
  padding:0 18px;
  background:#fff;
  color:#073c66;
  text-decoration:none;
  font-size:15px;
  font-weight:900;
  border-radius:9px;
  transition:.2s;
  white-space:nowrap;
}

.btn-sair:hover{
  background:#eef8fc;
  color:#079447;
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  background:#fff;
  border-radius:14px;
  padding:5px;
}

    /* =========================
       CONTEÚDO
    ========================= */

    main {
      max-width: 1200px;

      margin: 26px auto;

      padding: 0 20px;
    }

    /* =========================
       CARDS DE RESUMO
    ========================= */

    .resumo {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

      margin-bottom: 30px;
    }

    .card {
      background: white;

      border-radius: 14px;

      padding: 22px;

      min-height: 112px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

      border-left: 5px solid #159dd1;
    }

    .card h3 {
      font-size: 14px;

      color: #666;

      margin-bottom: 10px;
    }

    .numero {
      font-size: 32px;

      font-weight: bold;

      color: #073c66;
    }

    .pendente {
      border-left-color: #f47a20;
    }

    .analise {
      border-left-color: #159dd1;
    }

    .finalizado {
      border-left-color: #079447;
    }

    /* =========================
       SEÇÃO PRINCIPAL
    ========================= */

    .secao {
      background: white;

      border-radius: 15px;

      padding: 25px;

      border-top: 4px solid #159dd1;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
    }

    .secao-titulo {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }

    .secao-titulo h2 {
      font-size: 21px;

      color: #073c66;
    }

    /* =========================
       BUSCA
    ========================= */

    .busca {
      display: flex;

      gap: 10px;

      margin-bottom: 25px;

      background: #f6f8fa;

      padding: 12px;

      border-radius: 10px;
    }

    .busca input {
      flex: 1;

      padding: 13px 15px;

      border: 1px solid #ddd;

      border-radius: 8px;

      background: white;

      font-size: 15px;

      outline: none;
    }

    .busca input:focus {
      border-color: #159dd1;
    }

    /* =========================
       BOTÕES
    ========================= */

    button {
      border: none;

      border-radius: 8px;

      padding: 12px 20px;

      background: #159dd1;

      color: white;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    /* =========================
       LISTA DE ATENDIMENTOS
    ========================= */

    .atendimentos {
      display: flex;

      flex-direction: column;

      gap: 15px;
    }

    .atendimento {
      background: white;

      border: 1px solid #e4e4e4;

      border-left: 4px solid #159dd1;

      border-radius: 12px;

      padding: 18px;

      transition: 0.2s;
    }

    .atendimento:hover {
      box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
    }

    .atendimento-topo {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 12px;
    }

    .protocolo {
      font-weight: bold;

      color: #073c66;

      font-size: 15px;

      letter-spacing: 0.2px;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      padding: 6px 11px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;
    }

    .status-pendente {
      background: #fff3e8;

      color: #f47a20;
    }

    .status-analise {
      background: #e9f7fd;

      color: #159dd1;
    }

    .status-finalizado {
      background: #eefaf3;

      color: #079447;
    }

    .status-encerrado {
      background: #eeeeee;

      color: #555;
    }

    /* =========================
       DADOS DO ATENDIMENTO
    ========================= */

    .dados {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 10px;

      margin-bottom: 15px;
    }

    .campo strong {
      display: block;

      font-size: 12px;

      color: #777;

      margin-bottom: 3px;
    }

    .campo span {
      font-size: 14px;

      color: #333;
    }

    /* =========================
       MENSAGEM
    ========================= */

    .mensagem {
      background: #f6f8fa;

      border-radius: 8px;

      padding: 13px;

      margin-top: 10px;
    }

    .mensagem strong {
      display: block;

      font-size: 12px;

      color: #777;

      margin-bottom: 5px;
    }

    .mensagem p {
      font-size: 14px;

      line-height: 1.5;

      color: #333;

      word-break: break-word;
    }

    /* =========================
       ÁREA DA SECRETARIA
    ========================= */

    .area-secretaria {
      margin-top: 20px;

      padding: 18px;

      border: 1px solid #e5e5e5;

      border-radius: 10px;

      background: #fafcfd;
    }

    .area-secretaria label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;

      font-weight: bold;

      color: #073c66;
    }

    .area-secretaria select,
    .area-secretaria textarea {
      width: 100%;

      border: 1px solid #d9dfe3;

      border-radius: 8px;

      background: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      outline: none;
    }

    .area-secretaria select {
      padding: 11px;

      margin-bottom: 16px;
    }

    .area-secretaria textarea {
      min-height: 110px;

      padding: 12px;

      resize: vertical;
    }

    .area-secretaria select:focus,
    .area-secretaria textarea:focus {
      border-color: #159dd1;

      box-shadow:
        0 0 0 2px rgba(21,157,209,.10);
    }

    .btn-salvar {
      width: 100%;

      margin-top: 12px;

      background: #079447 !important;
    }

    .btn-salvar:hover {
      background: #067b3b !important;

      opacity: 1;
    }

    /* =========================
       RODAPÉ
    ========================= */

   footer{
  background:#20262b;
  color:#d0d5dd;
  padding:30px 22px;
  text-align:center;
  font-size:13px
}

    /* =========================
       RESPONSIVO
    ========================= */

    @media(max-width: 800px) {

      header {
        padding: 18px 16px;
      }

      .cabecalho {
        align-items: flex-start;
      }

      .titulo h1 {
        font-size: 22px;
      }

      main {
        padding: 0 14px;

        margin-top: 18px;
      }

      .resumo {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .secao {
        padding: 18px;
      }

      .dados {
        grid-template-columns: 1fr;
      }

    }

    @media(max-width: 500px) {

      .cabecalho {
        gap: 12px;
      }

      .logo {
        width: 58px;

        height: 58px;
      }

      .titulo h1 {
        font-size: 20px;
      }

      .titulo p {
        font-size: 13px;
      }

      .resumo {
        grid-template-columns: 1fr;
      }

      .secao-titulo {
        align-items: stretch;

        flex-direction: column;
      }

      .secao-titulo button {
        width: 100%;
      }

      .busca {
        flex-direction: column;

        padding: 10px;
      }

      .busca button {
        width: 100%;
      }

      .atendimento-topo {
        align-items: flex-start;

        flex-direction: column;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       CABEÇALHO
  ========================= -->

<header>

  <div class="cabecalho">

    <div class="titulo">
      <h1>📋 Painel da Secretaria</h1>
      <p>Central de Atendimento — AD Belém 49</p>
    </div>

    <div class="acoes-cabecalho">

      <a href="area-administrativa.html" class="btn-sair" onclick="sairDoPainel()">
        ← Sair
      </a>

      <img
        src="assets/Logo-Belem.png"
        class="logo"
        alt="AD Belém"
      >

    </div>

  </div>

</header>


  <!-- =========================
       CONTEÚDO
  ========================= -->

  <main>

    <!-- RESUMO -->

    <section class="resumo">

      <div class="card">

        <h3>
          Total de atendimentos
        </h3>

        <div
          class="numero"
          id="totalAtendimentos"
        >
          0
        </div>

      </div>


      <div class="card pendente">

        <h3>
          Pendentes
        </h3>

        <div
          class="numero"
          id="totalPendentes"
        >
          0
        </div>

      </div>


      <div class="card analise">

        <h3>
          Em análise
        </h3>

        <div
          class="numero"
          id="totalAnalise"
        >
          0
        </div>

      </div>


      <div class="card finalizado">

        <h3>
          Finalizados
        </h3>

        <div
          class="numero"
          id="totalFinalizados"
        >
          0
        </div>

      </div>

    </section>


    <!-- ATENDIMENTOS -->

    <section class="secao">

      <div class="secao-titulo">

        <h2>
          Atendimentos recebidos
        </h2>

        <button
          type="button"
          onclick="carregarAtendimentos()"
        >
          ↻ Atualizar
        </button>

      </div>


      <!-- BUSCA -->

      <div class="busca">

        <input
          type="text"
          id="buscarProtocolo"
          placeholder="Digite o protocolo do atendimento..."
        >

        <button
          type="button"
          onclick="buscarAtendimento()"
        >
          🔎 Buscar
        </button>

      </div>


      <!-- LISTA -->

      <div
        class="atendimentos"
        id="listaAtendimentos"
      >

        <p
          style="
            text-align:center;
            color:#777;
          "
        >
          Carregando atendimentos...
        </p>

      </div>

    </section>

  </main>


  <!-- =========================
       RODAPÉ
  ========================= -->

  <footer>

ASSEMBLEIA DE DEUS - MINISTERIO DO BELÉM
· SETOR 49 - JARDIM DOS PIMENTAS

<br>

<small>
PORTAL AD BELÉM - SETOR 49
</small>

</footer>


  <script>

    /* =========================
       API
    ========================= */

    const API_ATENDIMENTOS =
      "https://script.google.com/macros/s/AKfycbwJzijPbbP3PSZuTh2rpTpwmYIcBj44pZR2BaXOJwhZOZLGOQkDDPywJTMxy_90LbYb/exec";


    let atendimentos = [];


    /* =========================
       CARREGAR ATENDIMENTOS
    ========================= */

    function carregarAtendimentos() {

      const lista =
        document.getElementById(
          "listaAtendimentos"
        );


      lista.innerHTML = `
        <p style="
          text-align:center;
          color:#777;
        ">
          Carregando atendimentos...
        </p>
      `;


      const callbackName =
        "receberAtendimentos_" +
        Date.now();


      window[callbackName] =
        function(dados) {

          console.log(
            "ATENDIMENTOS RECEBIDOS:",
            dados
          );

          if (
            !dados ||
            !dados.sucesso
          ) {

            lista.innerHTML = `
              <div style="
                text-align:center;
                padding:35px 20px;
                color:#b51e2a;
              ">

                <div style="
                  font-size:40px;
                  margin-bottom:12px;
                ">
                  ⚠️
                </div>

                <strong>
                  Não foi possível carregar os atendimentos.
                </strong>

                <p style="
                  margin-top:8px;
                  color:#777;
                ">
                  ${
                    dados?.erro ||
                    "Erro ao consultar a Secretaria."
                  }
                </p>

              </div>
            `;

            delete window[callbackName];

            const erroScript =
              document.getElementById(
                callbackName
              );

            if (erroScript) {
              erroScript.remove();
            }

            return;
          }


          atendimentos =
            dados.atendimentos || [];


          atualizarResumo();


          if (
            atendimentos.length === 0
          ) {

            lista.innerHTML = `
              <div style="
                text-align:center;
                padding:35px 20px;
                color:#777;
              ">

                <div style="
                  font-size:40px;
                  margin-bottom:12px;
                ">
                  📭
                </div>

                <strong>
                  Nenhum atendimento encontrado
                </strong>

                <p style="
                  margin-top:8px;
                ">
                  Ainda não existem solicitações registradas.
                </p>

              </div>
            `;

          } else {

            lista.innerHTML =
              atendimentos
                .slice()
                .reverse()
                .map(
                  item => criarCard(item)
                )
                .join("");

          }


          console.log(
            "Total de atendimentos carregados:",
            atendimentos.length
          );


          delete window[callbackName];


          const script =
            document.getElementById(
              callbackName
            );


          if (script) {
            script.remove();
          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.id =
        callbackName;


      script.src =
        API_ATENDIMENTOS +
        "?callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          console.error(
            "Erro ao carregar JSONP."
          );


          lista.innerHTML = `
            <div style="
              text-align:center;
              padding:35px 20px;
              color:#b51e2a;
            ">

              <div style="
                font-size:40px;
                margin-bottom:12px;
              ">
                ⚠️
              </div>

              <strong>
                Erro ao conectar com a Secretaria.
              </strong>

              <p style="
                margin-top:8px;
                color:#777;
              ">
                Não foi possível consultar os atendimentos.
              </p>

            </div>
          `;


          delete window[callbackName];

          script.remove();

        };


      document.body.appendChild(
        script
      );

    }


    /* =========================
       ATUALIZAR RESUMO
    ========================= */

    function atualizarResumo() {

      const total =
        atendimentos.length;


      const pendentes =
        atendimentos.filter(
          item =>
            String(
              item.status || ""
            )
              .toUpperCase() ===
            "PENDENTE"
        ).length;


      const analise =
        atendimentos.filter(
          item => {

            const status =
              String(
                item.status || ""
              )
                .toUpperCase();


            return (
              status === "EM ANÁLISE" ||
              status === "EM ANALISE"
            );

          }
        ).length;


      const finalizados =
        atendimentos.filter(
          item => {

            const status =
              String(
                item.status || ""
              )
                .toUpperCase();


            return (
              status === "FINALIZADO" ||
              status === "CONCLUÍDO" ||
              status === "CONCLUIDO"
            );

          }
        ).length;


      document.getElementById(
        "totalAtendimentos"
      ).textContent = total;


      document.getElementById(
        "totalPendentes"
      ).textContent = pendentes;


      document.getElementById(
        "totalAnalise"
      ).textContent = analise;


      document.getElementById(
        "totalFinalizados"
      ).textContent = finalizados;

    }


    /* =========================
       BUSCAR PROTOCOLO
    ========================= */

    function buscarAtendimento() {

      const protocolo =
        document
          .getElementById(
            "buscarProtocolo"
          )
          .value
          .trim();


      if (!protocolo) {

        carregarAtendimentos();

        return;

      }


      const resultado =
        atendimentos.find(
          item =>
            String(
              item.protocolo
            )
              .toUpperCase() ===
            protocolo.toUpperCase()
        );


      const lista =
        document.getElementById(
          "listaAtendimentos"
        );


      if (!resultado) {

        lista.innerHTML = `
          <div style="
            text-align:center;
            padding:30px;
            color:#777;
          ">

            <div style="
              font-size:35px;
              margin-bottom:10px;
            ">
              🔎
            </div>

            <strong>
              Atendimento não encontrado
            </strong>

            <p style="
              margin-top:7px;
            ">
              Verifique o número do protocolo.
            </p>

          </div>
        `;

        return;

      }


      renderizarAtendimento(
        resultado
      );

    }


    /* =========================
       RENDERIZAR ATENDIMENTO
    ========================= */

    function renderizarAtendimento(item) {

      const lista =
        document.getElementById(
          "listaAtendimentos"
        );


      lista.innerHTML =
        criarCard(item);

    }


    /* =========================
       CRIAR CARD
    ========================= */

    function criarCard(item) {

      const status =
        String(
          item.status ||
          "PENDENTE"
        )
          .toUpperCase();


      let classeStatus =
        "status-pendente";


      if (
        status === "EM ANÁLISE" ||
        status === "EM ANALISE"
      ) {

        classeStatus =
          "status-analise";

      } else if (
        status === "FINALIZADO" ||
        status === "CONCLUÍDO" ||
        status === "CONCLUIDO"
      ) {

        classeStatus =
          "status-finalizado";

      } else if (
        status === "ENCERRADO"
      ) {

        classeStatus =
          "status-encerrado";

      }


      return `

        <div class="atendimento">


          <div class="atendimento-topo">

            <div class="protocolo">

              ${item.protocolo || "Sem protocolo"}

            </div>


            <span
              class="
                status
                ${classeStatus}
              "
            >

              ${status}

            </span>

          </div>


          <div class="dados">


            <div class="campo">

              <strong>
                Nome
              </strong>

              <span>
                ${item.nome || "-"}
              </span>

            </div>


            <div class="campo">

              <strong>
                WhatsApp
              </strong>

              <span>
                ${item.whatsapp || "-"}
              </span>

            </div>


            <div class="campo">

              <strong>
                Tipo
              </strong>

              <span>
                ${item.tipo || "-"}
              </span>

            </div>


            <div class="campo">

              <strong>
                Data
              </strong>

              <span>
                ${item.data || "-"}
              </span>

            </div>


          </div>


          <div class="campo">

            <strong>
              Assunto
            </strong>

            <span>
              ${item.assunto || "-"}
            </span>

          </div>


          <div class="mensagem">

            <strong>
              Mensagem
            </strong>

            <p>
              ${item.mensagem || "-"}
            </p>

          </div>


          <!-- =========================
               ÁREA DA SECRETARIA
          ========================= -->

          <div class="area-secretaria">


            <label
              for="status-${item.protocolo}"
            >
              Status do atendimento
            </label>


            <select
              id="status-${item.protocolo}"
            >

              <option
                value="PENDENTE"
                ${status === "PENDENTE" ? "selected" : ""}
              >
                PENDENTE
              </option>


              <option
                value="EM ANÁLISE"
                ${
                  status === "EM ANÁLISE" ||
                  status === "EM ANALISE"
                    ? "selected"
                    : ""
                }
              >
                EM ANÁLISE
              </option>


              <option
                value="FINALIZADO"
                ${status === "FINALIZADO" ? "selected" : ""}
              >
                FINALIZADO
              </option>


              <option
                value="ENCERRADO"
                ${status === "ENCERRADO" ? "selected" : ""}
              >
                ENCERRADO
              </option>

            </select>


            <label
              for="resposta-${item.protocolo}"
            >
              Resposta da Secretaria
            </label>


            <textarea
              id="resposta-${item.protocolo}"
              placeholder="Digite aqui a resposta para o solicitante..."
            >${item.resposta || ""}</textarea>


            <button
              type="button"
              class="btn-salvar"
              onclick="salvarAtendimento('${item.protocolo}', this)"
            >
              💾 Salvar atendimento
            </button>


          </div>


        </div>

      `;

    }


    /* =========================
       SALVAR ATENDIMENTO
    ========================= */

    async function salvarAtendimento(
      protocolo,
      botao
    ) {

      const statusElement =
        document.getElementById(
          `status-${protocolo}`
        );


      const respostaElement =
        document.getElementById(
          `resposta-${protocolo}`
        );


      if (
        !statusElement ||
        !respostaElement
      ) {

        alert(
          "Não foi possível localizar os dados do atendimento."
        );

        return;

      }


      const status =
        statusElement.value;


      const resposta =
        respostaElement.value.trim();


      const textoOriginal =
        botao.innerHTML;


      botao.disabled = true;

      botao.innerHTML =
        "⏳ Salvando...";


      const callbackName =
        "atualizarAtendimento_" +
        Date.now();


      window[callbackName] =
        function(dados) {

          try {

            if (
              !dados ||
              !dados.sucesso
            ) {

              throw new Error(
                dados?.erro ||
                dados?.mensagem ||
                "Não foi possível atualizar o atendimento."
              );

            }


            alert(
              "Atendimento atualizado com sucesso!"
            );


            delete window[
              callbackName
            ];


            const script =
              document.getElementById(
                callbackName
              );


            if (script) {
              script.remove();
            }


            carregarAtendimentos();


          } catch (erro) {

            console.error(
              erro
            );


            alert(
              "Erro ao salvar o atendimento:\n\n" +
              erro.message
            );


          } finally {

            botao.disabled = false;

            botao.innerHTML =
              textoOriginal;

          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.id =
        callbackName;


      script.src =
        API_ATENDIMENTOS +
        "?acao=atualizar" +
        "&protocolo=" +
        encodeURIComponent(
          protocolo
        ) +
        "&status=" +
        encodeURIComponent(
          status
        ) +
        "&resposta=" +
        encodeURIComponent(
          resposta
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          console.error(
            "Erro ao atualizar atendimento via JSONP."
          );


          alert(
            "Não foi possível conectar com a Secretaria para salvar o atendimento."
          );


          delete window[
            callbackName
          ];


          script.remove();


          botao.disabled = false;


          botao.innerHTML =
            textoOriginal;

        };


      document.body.appendChild(
        script
      );

    }


    /* =========================
       INICIAR
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        carregarAtendimentos();

      }
    );

function sairDoPainel(){
  window.location.href = "area-administrativa.html";
}
    
  </script>
