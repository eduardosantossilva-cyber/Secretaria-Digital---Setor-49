<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Solicitações | AD Belém 49</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f6f8fa;color:#073c66}
header{background:linear-gradient(135deg,#073c66,#159dd1);color:#fff;padding:22px 20px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.cabecalho{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:30px}
.titulo{flex:1}.titulo h1{font-size:30px;margin-bottom:6px;line-height:1.2}.titulo p{font-size:16px;opacity:.92}
.acoes-cabecalho{display:flex;align-items:center;gap:18px}
.btn-sair{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 18px;background:#fff;color:#073c66;text-decoration:none;font-size:15px;font-weight:900;border-radius:9px;white-space:nowrap}
.logo{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:14px;padding:5px}
main{max-width:1200px;margin:26px auto;padding:0 20px}
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
.card{background:#fff;border-radius:14px;padding:22px;min-height:112px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.08);border-left:5px solid #159dd1}
.card h3{font-size:14px;color:#666;margin-bottom:10px}.numero{font-size:32px;font-weight:bold;color:#073c66}
.pendente{border-left-color:#f47a20}.analise{border-left-color:#159dd1}.finalizado{border-left-color:#079447}
.secao{background:#fff;border-radius:15px;padding:25px;border-top:4px solid #159dd1;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.secao-titulo{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.secao-titulo h2{font-size:21px}
.abas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.aba{border:1px solid #d9dfe3;background:#f6f8fa;color:#073c66;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:900;cursor:pointer}
.aba.ativa{background:#159dd1;color:#fff;border-color:#159dd1}
.busca{display:flex;gap:10px;margin-bottom:22px;background:#f6f8fa;padding:12px;border-radius:10px}
.busca input{flex:1;padding:13px 15px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:15px;outline:none}
button{border:none;border-radius:8px;padding:12px 20px;background:#159dd1;color:#fff;font-size:14px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.lista{display:flex;flex-direction:column;gap:15px}
.solicitacao{background:#fff;border:1px solid #e4e4e4;border-left:4px solid #159dd1;border-radius:12px;padding:18px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}
.protocolo{font-weight:bold;color:#073c66;font-size:15px}.tipo{display:inline-flex;margin-top:6px;padding:5px 10px;border-radius:20px;background:#eef8fc;color:#159dd1;font-size:11px;font-weight:900}
.status{display:inline-flex;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:bold}
.status-pendente{background:#fff3e8;color:#f47a20}.status-analise{background:#e9f7fd;color:#159dd1}.status-finalizado{background:#eefaf3;color:#079447}.status-encerrado{background:#eee;color:#555}
.dados{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}.campo strong{display:block;font-size:12px;color:#777;margin-bottom:3px}.campo span{font-size:14px;color:#333;word-break:break-word}
.detalhes{margin-top:12px;background:#f6f8fa;border-radius:8px;padding:13px}
.area-secretaria{margin-top:20px;padding:18px;border:1px solid #e5e5e5;border-radius:10px;background:#fafcfd}
.area-secretaria label{display:block;margin-bottom:8px;font-size:13px;font-weight:bold}
.area-secretaria select,.area-secretaria textarea{width:100%;border:1px solid #d9dfe3;border-radius:8px;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:14px;outline:none}
.area-secretaria select{padding:11px;margin-bottom:16px}.area-secretaria textarea{min-height:100px;padding:12px;resize:vertical}
.btn-salvar{width:100%;margin-top:12px;background:#079447}
.vazio{text-align:center;padding:45px 20px;color:#777}.vazio .icone{font-size:42px;margin-bottom:12px}
.carregando{text-align:center;padding:35px;color:#777}
footer{background:#20262b;color:#d0d5dd;padding:30px 22px;text-align:center;font-size:13px;margin-top:26px}
@media(max-width:800px){.cabecalho{align-items:flex-start}.titulo h1{font-size:22px}main{padding:0 14px}.resumo{grid-template-columns:repeat(2,1fr)}.secao{padding:18px}.dados{grid-template-columns:1fr}}
@media(max-width:500px){.logo{width:58px;height:58px}.titulo h1{font-size:20px}.titulo p{font-size:13px}.resumo{grid-template-columns:1fr}.secao-titulo{align-items:stretch;flex-direction:column}.secao-titulo button,.busca button{width:100%}.busca{flex-direction:column;padding:10px}.topo{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="cabecalho">
  <div class="titulo"><h1>📋 Painel de Solicitações</h1><p>Secretaria + Digital — AD Belém 49</p></div>
  <div class="acoes-cabecalho"><a href="area-administrativa.html" class="btn-sair">← Sair</a><img src="assets/Logo-Belem.png" class="logo" alt="AD Belém"></div>
</div></header>

<main>
<section class="resumo">
  <div class="card"><h3>Total de solicitações</h3><div class="numero" id="totalSolicitacoes">0</div></div>
  <div class="card pendente"><h3>Pendentes</h3><div class="numero" id="totalPendentes">0</div></div>
  <div class="card analise"><h3>Em análise</h3><div class="numero" id="totalAnalise">0</div></div>
  <div class="card finalizado"><h3>Finalizadas</h3><div class="numero" id="totalFinalizadas">0</div></div>
</section>

<section class="secao">
  <div class="secao-titulo"><h2>Solicitações recebidas</h2><button type="button" onclick="carregar()">↻ Atualizar</button></div>
  <div class="abas">
    <button class="aba ativa" onclick="selecionar('TODAS',this)">Todas</button>
    <button class="aba" onclick="selecionar('CARTEIRINHA',this)">🪪 Carteirinhas</button>
    <button class="aba" onclick="selecionar('BATISMO',this)">💧 Batismos</button>
    <button class="aba" onclick="selecionar('APRESENTACAO',this)">👶 Apresentações</button>
  </div>
  <div class="busca"><input id="busca" placeholder="Digite nome ou protocolo..."><button onclick="filtrar()">🔎 Buscar</button></div>
  <div class="lista" id="lista"><div class="carregando">Carregando solicitações...</div></div>
</section>
</main>

<footer>ASSEMBLEIA DE DEUS - MINISTÉRIO DO BELÉM · SETOR 49 - JARDIM DOS PIMENTAS<br><small>PORTAL AD BELÉM - SETOR 49</small></footer>

<script>
const API="https://script.google.com/macros/s/AKfycbzsJKoegOsOvPo3PhfHoZUd3A9Mfk4MrFO6DFe9t48VjDjo_2jt9xK-mw5sQRsnGR1Q/exec";
let dados=[],tipoAtual="TODAS";

function carregar(){
  const lista=document.getElementById("lista");
  lista.innerHTML='<div class="carregando">Carregando solicitações...</div>';
  const cb="receberSolicitacoes_"+Date.now();
  window[cb]=function(r){
    try{
      if(!r||!r.sucesso) throw new Error(r?.erro||"Não foi possível carregar as solicitações.");
      dados=r.solicitacoes||[];
      atualizarResumo();
      filtrar();
    }catch(e){
      lista.innerHTML='<div class="vazio"><div class="icone">⚠️</div><strong>Erro ao carregar as solicitações</strong><p>'+esc(e.message)+'</p></div>';
    }finally{
      delete window[cb];
      document.getElementById(cb)?.remove();
    }
  };
  const s=document.createElement("script");
  s.id=cb;s.src=API+"?acao=listar&callback="+encodeURIComponent(cb);
  s.onerror=()=>{lista.innerHTML='<div class="vazio"><div class="icone">⚠️</div><strong>Erro de conexão</strong><p>Não foi possível consultar a Secretaria.</p></div>';delete window[cb];s.remove();};
  document.body.appendChild(s);
}

function atualizarResumo(){
  const p=dados.filter(x=>String(x.status).toUpperCase()==="PENDENTE").length;
  const a=dados.filter(x=>["EM ANÁLISE","EM ANALISE"].includes(String(x.status).toUpperCase())).length;
  const f=dados.filter(x=>["FINALIZADO","CONCLUÍDO","CONCLUIDO"].includes(String(x.status).toUpperCase())).length;
  document.getElementById("totalSolicitacoes").textContent=dados.length;
  document.getElementById("totalPendentes").textContent=p;
  document.getElementById("totalAnalise").textContent=a;
  document.getElementById("totalFinalizadas").textContent=f;
}
function selecionar(tipo,b){tipoAtual=tipo;document.querySelectorAll(".aba").forEach(x=>x.classList.remove("ativa"));b.classList.add("ativa");filtrar();}
function filtrar(){
  const termo=document.getElementById("busca").value.trim().toUpperCase();
  const lista=dados.filter(x=>{
    const okTipo=tipoAtual==="TODAS"||x.tipo===tipoAtual;
    const nome = obterCampo(x.dados, ["Nome Completo:", "Nome Completo", "Nome da Criança", "Nome"]) || x.nome || "";
    const contato = obterCampo(x.dados, ["Celular / WhatsApp:", "Celular / WhatsApp", "Celular", "WhatsApp", "Telefone"]) || x.contato || "";
    const texto=(nome+" "+x.protocolo+" "+contato).toUpperCase();
    return okTipo&&(!termo||texto.includes(termo));
  });
  renderizar(lista);
}
function renderizar(lista){
  const el=document.getElementById("lista");
  if(!lista.length){el.innerHTML='<div class="vazio"><div class="icone">📭</div><strong>Nenhuma solicitação encontrada</strong><p>Não há registros para os filtros selecionados.</p></div>';return;}
  el.innerHTML=lista.map(criarCard).join("");
}
function classeStatus(s){
  s=String(s||"PENDENTE").toUpperCase();
  if(s==="EM ANÁLISE"||s==="EM ANALISE")return"status-analise";
  if(s==="FINALIZADO"||s==="CONCLUÍDO"||s==="CONCLUIDO")return"status-finalizado";
  if(s==="ENCERRADO")return"status-encerrado";
  return"status-pendente";
}
function criarCard(x){
  const status=String(x.status||"PENDENTE").toUpperCase();
  const resposta=x.resposta||"";
  const d=x.dados||{};

  // O Google Forms pode devolver cabeçalhos com ":" no final.
  // Localizamos os campos de forma tolerante, sem depender do nome exato.
  const nomePainel =
    obterCampo(d, ["Nome Completo:", "Nome Completo"]) ||
    obterCampo(d, ["Nome da Criança"]) ||
    x.nome ||
    "-";

  const contatoPainel =
    obterCampo(d, ["Celular / WhatsApp:", "Celular / WhatsApp"]) ||
    obterCampo(d, ["Celular", "WhatsApp"]) ||
    obterCampo(d, ["Telefone"]) ||
    x.contato ||
    "-";

  const extras=Object.entries(d).filter(([k,v])=>{
    if(!v)return false;
    return !["Carimbo de data/hora","Protocolo","Status","Resposta da Secretaria","LGPD"].includes(k);
  }).slice(0,30);
  return `<div class="solicitacao">
    <div class="topo">
      <div><div class="protocolo">${esc(x.protocolo)}</div><span class="tipo">${esc(x.tipo)}</span></div>
      <span class="status ${classeStatus(status)}">${esc(status)}</span>
    </div>
    <div class="dados">
      <div class="campo"><strong>Nome</strong><span>${esc(nomePainel)}</span></div>
      <div class="campo"><strong>Contato</strong><span>${esc(contatoPainel)}</span></div>
      <div class="campo"><strong>Data da solicitação</strong><span>${esc(x.data)}</span></div>
      <div class="campo"><strong>Informações principais</strong><span>${esc(x.detalhe)}</span></div>
    </div>
    <details class="detalhes"><summary><strong>📋 Ver todos os dados da solicitação</strong></summary>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px">
        ${extras.map(([k,v])=>`<div class="campo"><strong>${esc(k)}</strong><span>${esc(formatarValorCampo(k,v))}</span></div>`).join("")}
      </div>
    </details>
    <div class="area-secretaria">
      <label>Status da solicitação</label>
      <select id="status-${escId(x.protocolo)}">
        ${["PENDENTE","EM ANÁLISE","FINALIZADO","ENCERRADO"].map(s=>`<option ${status===s?"selected":""}>${s}</option>`).join("")}
      </select>
      <label>Resposta da Secretaria</label>
      <textarea id="resposta-${escId(x.protocolo)}" placeholder="Digite aqui a resposta para o solicitante...">${esc(resposta)}</textarea>
      <button type="button" class="btn-salvar" onclick="salvar('${escAttr(x.protocolo)}',this)">💾 Salvar solicitação</button>
    </div>
  </div>`;
}
function salvar(protocolo,b){
  const id=escId(protocolo);
  const status=document.getElementById("status-"+id).value;
  const resposta=document.getElementById("resposta-"+id).value.trim();
  const original=b.textContent;b.disabled=true;b.textContent="⏳ Salvando...";
  const cb="salvar_"+Date.now();
  window[cb]=function(r){
    try{
      if(!r||!r.sucesso)throw new Error(r?.erro||"Não foi possível salvar.");
      alert("Solicitação atualizada com sucesso!");
      carregar();
    }catch(e){alert("Erro ao salvar:\n\n"+e.message);}
    finally{delete window[cb];document.getElementById(cb)?.remove();b.disabled=false;b.textContent=original;}
  };
  const s=document.createElement("script");
  s.id=cb;
  s.src=API+"?acao=atualizar&protocolo="+encodeURIComponent(protocolo)+"&status="+encodeURIComponent(status)+"&resposta="+encodeURIComponent(resposta)+"&callback="+encodeURIComponent(cb);
  s.onerror=()=>{alert("Não foi possível conectar com a Secretaria para salvar.");delete window[cb];s.remove();b.disabled=false;b.textContent=original;};
  document.body.appendChild(s);
}
function obterCampo(obj, aliases){
  if(!obj || typeof obj!=="object") return "";

  // Tenta primeiro os cabeçalhos exatamente como vêm do Google Forms.
  for(const alias of aliases){
    if(Object.prototype.hasOwnProperty.call(obj, alias)){
      const valor = obj[alias];
      if(valor !== null && valor !== undefined && String(valor).trim() !== ""){
        return String(valor);
      }
    }
  }

  // Segunda tentativa: ignora apenas espaços e ":" no final do cabeçalho.
  const normalizar = function(v){
    return String(v||"")
      .trim()
      .toUpperCase()
      .replace(/\s*:\s*$/,"")
      .replace(/\s+/g," ");
  };

  const procurados = aliases.map(normalizar);

  for(const chave of Object.keys(obj)){
    if(!procurados.includes(normalizar(chave))) continue;

    const valor = obj[chave];
    if(valor !== null && valor !== undefined && String(valor).trim() !== ""){
      return String(valor);
    }
  }

  return "";
}

function formatarValorCampo(chave, valor){
  if(valor === null || valor === undefined || valor === "") return "";

  const texto = String(valor).trim();
  const chaveNormalizada = String(chave || "").toUpperCase();

  // Datas vindas do Google Sheets podem chegar ao navegador como ISO,
  // por exemplo: 2000-01-01T02:00:00.000Z.
  const pareceData =
    chaveNormalizada.includes("DATA") ||
    chaveNormalizada.includes("NASCIMENTO") ||
    chaveNormalizada.includes("BATISMO") ||
    chaveNormalizada.includes("CONSAGR") ||
    chaveNormalizada.includes("ADMITIDO");

  if(!pareceData) return texto;

  // ISO completo com data e hora.
  let m = texto.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if(m){
    return m[3]+"/"+m[2]+"/"+m[1];
  }

  // ISO apenas com a data.
  m = texto.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){
    return m[3]+"/"+m[2]+"/"+m[1];
  }

  // Data no formato yyyy/mm/dd.
  m = texto.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  if(m){
    return m[3]+"/"+m[2]+"/"+m[1];
  }

  return texto;
}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function escAttr(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g," ");}
function escId(v){return String(v??"").replace(/[^a-zA-Z0-9_-]/g,"_");}
document.getElementById("busca").addEventListener("keydown",e=>{if(e.key==="Enter")filtrar();});
document.addEventListener("DOMContentLoaded",carregar);
</script>
</body>
</html>
